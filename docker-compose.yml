# Local infrastructure for Motion Studio.
#
#   docker compose up -d
#
# Brings up the MongoDB and Redis the API needs. Everything else (the API, the
# Next.js client and the render worker) runs from `pnpm dev`.
services:
  mongo:
    image: mongo:7
    container_name: motion-studio-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: motion-studio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Queue state is rebuildable, so persistence is off by default.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
